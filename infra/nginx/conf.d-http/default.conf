# HTTP-only config — use before SSL certificate is issued
# After SSL setup, replace with default.conf
server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge (^~ ensures priority over regex location)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 추적 리디렉션 — HTTPS conf 와 동일. 이 블록이 없으면 정적 catch-all 이 /go/* 를
    # index.html 로 돌려 qualified_visit 계측·쿠키·UTM 랜딩이 전부 사라진다 (2026-08-17 리뷰).
    location /go/ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public delivery is a DB approval check, not direct possession of a versioned path.
    location ^~ /assets/generated/ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Only X-Accel-Redirect responses from the backend can enter this location.
    location ^~ /_creative_assets_internal/ {
        internal;
        alias /var/www/creative_assets/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Creative runner multipart uploads (service-token protected by the API).
    location ^~ /api/v1/creative-runner/ {
        client_max_body_size 160M;
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Only the authenticated creative input upload accepts large multipart bodies.
    location ~ "^/api/v1/admin/creatives/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/inputs$" {
        client_max_body_size 160M;
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Auth endpoints — stricter rate limit
    location /api/v1/auth/ {
        limit_req zone=auth burst=3 nodelay;

        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
    }

    # Root
    location / {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
