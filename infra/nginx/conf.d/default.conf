# 브라우저가 WebP 를 받을 수 있는지 — 블로그 이미지 서빙에만 쓴다(아래 location).
# conf.d/*.conf 는 nginx.conf 의 http{} 안에서 include 되므로 map 을 여기 둘 수 있다.
map $http_accept $webp_ext {
    default        "";        # WebP 미표기(=대부분의 공유 미리보기 크롤러) → 원본 PNG
    "~*image/webp" ".webp";
}

# HTTP — redirect to HTTPS + ACME challenge (bideasy.kr / www / api 모두 처리)
# api.bideasy.kr 의 ACME 검증도 같이 받아주기 위해 server_name 에 포함.
# api 의 HTTPS 블록은 별도 파일(api.bideasy.kr.conf)에 두고, cert 발급 후 활성화.
server {
    listen 80;
    server_name bideasy.kr www.bideasy.kr api.bideasy.kr;

    # Let's Encrypt challenge (^~ ensures priority over regex location)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — www → apex 301 (중복 색인 방지, SEO 단일 도메인)
server {
    listen 443 ssl;
    http2 on;
    server_name www.bideasy.kr;

    ssl_certificate /etc/letsencrypt/live/bideasy.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bideasy.kr/privkey.pem;

    return 301 https://bideasy.kr$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name bideasy.kr;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/bideasy.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bideasy.kr/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 보안 헤더 — nginx 의 add_header 는 하위 블록에서 재선언하면 상위(http) 블록을
    # 상속하지 않으므로(전부 덮어씀), 이 server 블록에서 HSTS 와 함께 모두 재선언한다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 운영자 Mac creative runner — 큰 MP4 multipart 업로드는 이 인증 경로에만 허용.
    location ^~ /api/v1/creative-runner/ {
        client_max_body_size 160M;
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 관리자 크리에이티브 입력 업로드만 큰 multipart를 허용한다. 일반 /api
    # 요청의 body 한도는 넓히지 않는다.
    location ~ "^/api/v1/admin/creatives/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/inputs$" {
        client_max_body_size 160M;
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    # API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Auth endpoints — stricter rate limit
    location /api/v1/auth/ {
        limit_req zone=auth burst=3 nodelay;

        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃은 상속되지 않는다 — 이 블록에 없으면 기본 60초다.
        # 가입은 퍼널의 목이라 오래 매달리는 것보다 빨리 실패하는 편이 낫다.
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
    }

    # OAuth callbacks
    location /auth/callback/ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment callbacks
    location /api/v1/payments/ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 공고 상세 SSR (/bid/{공고번호}) — 백엔드 Jinja2 렌더 (SEO 롱테일)
    # catch-all location / 보다 prefix 가 길어 우선 매칭됨.
    location /bid/ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 공고 검색 SSR (/search) — 서버가 초기 목록을 렌더해 크롤러에게 /bid/* 진입
    # 경로를 준다. 정적 /search.html 은 제거됐고, 옛 링크는 301 로 흡수한다.
    location = /search {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /search.html {
        return 301 /search;
    }

    # SEO — sitemap / robots (백엔드 생성)
    # /sitemap.xml 은 인덱스, 실제 URL 목록은 /sitemap-{static,blog,notices-N}.xml.
    location = /sitemap.xml {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
    }
    location ~ ^/sitemap-[a-z0-9-]+\.xml$ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
    }

    # 개인정보처리방침 — GitHub Pages 로 리다이렉트 (단일 소스 유지)
    location = /privacy {
        return 302 https://hosicompany.github.io/bideasy-policy/;
    }

    # 블로그 SSR (/blog, /blog/{slug}) — 백엔드 Jinja2 렌더 (SEO 콘텐츠)
    location = /blog {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /blog/ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 승인된 creative_id만 동일 사이트 랜딩으로 보내는 추적 링크.
    # 이 블록이 없으면 정적 catch-all이 /go/*를 index.html로 돌려 계측과
    # 랜딩 이동이 모두 사라진다.
    location /go/ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 관리자 정적 패널 — 실제 권한검사는 API(require_admin)가 하지만, UI 노출면을 줄인다.
    # noindex 로 검색 색인 차단(즉시 적용). 추가 보호를 켜려면 아래 둘 중 하나 주석 해제:
    #   1) Basic Auth(권장): 서버에서 `htpasswd -c /etc/nginx/.htpasswd admin` 생성 후
    #        auth_basic "BidEasy Admin"; auth_basic_user_file /etc/nginx/.htpasswd;
    #   2) IP allowlist:  allow <고정 사무실 IP>;  deny all;
    location ~ ^/admin {
        root /var/www/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # auth_basic "BidEasy Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri.html =404;
    }

    # 블로그 이미지 — URL 은 .png 그대로 두고 서빙만 WebP 로 바꾼다.
    # 경로 자체를 .webp 로 바꾸지 않는 이유: 이미 발행된 글의 본문 마크다운·frontmatter·
    # DB(BlogPost.hero)가 전부 .png 를 가리키고 있어 발행분까지 고쳐야 한다.
    #
    # Accept 로 갈라 주는 이유: 히어로가 곧 og:image 인데, 카카오톡·네이버 공유
    # 미리보기 크롤러의 WebP 지원이 불확실하다. 크롤러는 Accept 에 image/webp 를
    # 안 붙이므로 자동으로 PNG 를 받는다. 그래서 PNG 는 지우지 않고 남겨 둔다.
    # (실측: 브라우저 전송량 10.7MB → 0.4MB, 97% 절감)
    #
    # webp 생성은 backend/scripts/webp_blog_assets.py — 새 이미지를 넣은 뒤 다시 돌리면 된다.
    location ~ ^/assets/blog/(?<blogimg>.+)\.png$ {
        root /var/www/html;
        try_files /assets/blog/$blogimg$webp_ext $uri =404;

        # 같은 URL 이 Accept 에 따라 다른 바이트를 주므로 Vary 가 없으면
        # 중간 캐시가 WebP 를 크롤러에게, PNG 를 브라우저에게 잘못 줄 수 있다.
        add_header Vary Accept;
        # expires 가 Cache-Control 을 만들어 주므로 따로 add_header 하지 않는다(중복 발급됨).
        # immutable 은 쓰지 않는다 — 파일명이 hero.png 로 고정이라, 이미지를 다시 만들면
        # immutable 이 걸린 브라우저는 30일간 옛 그림을 계속 보게 된다.
        expires 30d;
        # add_header 를 재선언하면 상위 블록 헤더를 상속하지 않는다(이 파일 상단 주석 참고).
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 파일 경로 자체는 승인 토큰이 아니다. backend가 output/attempt/brief의 승인 상태를
    # 확인한 뒤에만 아래 internal alias로 넘긴다. 검수 전 파일은 admin/runner 인증 API만
    # 같은 alias를 사용할 수 있다.
    location ^~ /assets/generated/ {
        proxy_pass http://bideasy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /_creative_assets_internal/ {
        internal;
        alias /var/www/creative_assets/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header X-Content-Type-Options "nosniff" always;
    }
    # 정적 페이지 (Landing / Login 등)
    # bideasy.kr 을 Lightsail 로 가져오면서 단일 도메인에 모든 페이지 제공.
    # try_files: /foo 요청 시 /foo, /foo.html, /foo/ 순으로 시도.
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
