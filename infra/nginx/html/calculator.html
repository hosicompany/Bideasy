  <script type="application/ld+json">

    "mainEntity": [
      {
        "@type": "Question",
        "name": "낙찰하한율이 뭔가요?",
        "acceptedAnswer": { "@type": "Answer", "text": "예정가격 대비 이 비율 미만으로 투찰하면 낙찰받을 수 없는 하한선이에요. 적격심사 공사는 금액대별로 달라요 — 2026년 개정 기준 10억 미만 89.745%, 10억~50억 88.745%, 50억 이상 87.495% (공고문 확인 필수). 하한선 바로 위 구간에 투찰이 몰리기 때문에 1원 단위 계산이 중요해요." }
      },
      {
        "@type": "Question",
        "name": "A값은 어디서 확인하나요?",
        "acceptedAnswer": { "@type": "Answer", "text": "A값은 사후정산 비목 10종(국민연금·건강보험·노인장기요양보험료, 퇴직공제부금비, 산업안전보건관리비, 안전관리비, 품질관리비, 환경보전비, 안전점검비, 하도급대금지급보증서 발급수수료)의 합계예요. 산재·고용보험은 들어가지 않아요. 조달청 기초금액 조회 응답에 구성요소가 함께 오기 때문에 BidEasy는 이 값을 자동으로 채워요. 공사 입찰에만 영향이 있어요." }
      },
      {
        "@type": "Question",
        "name": "투찰가는 어떻게 계산하나요?",
        "acceptedAnswer": { "@type": "Answer", "text": "투찰가 = (기초금액 − A값) × 투찰률 + A값이고, 낙찰하한선은 같은 방식으로 (기초금액 − A값) × 낙찰하한율 + A값이에요. A값에는 비율을 곱하지 않아요. BidEasy 계산기는 10원 미만 절사까지 자동으로 처리해요." }
      }
    ]
  }
